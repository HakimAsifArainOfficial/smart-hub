   SECURE PASSWORD VAULT
   Argon2id + AES-256-GCM
   ========================================================= */

(function () {

  const VAULT_KEY = "smartHubSecureVault";
  const OLD_VAULT_KEY = "smartHubPasswordManager";

  let shVaultUnlocked = false;
  let shVaultKey = null;
  let shVaultData = [];

  /* ---------------------------------------------------------
     LOAD ARGON2-BROWSER
     --------------------------------------------------------- */

  function shLoadArgon2() {

    return new Promise(function (resolve, reject) {

      if (window.argon2) {
        resolve(window.argon2);
        return;
      }

      const existing =
        document.querySelector(
          'script[data-sh-argon2="true"]'
        );

      if (existing) {

        existing.addEventListener(
          "load",
          function () {
            resolve(window.argon2);
          }
        );

        existing.addEventListener(
          "error",
          reject
        );

        return;
      }

      const script =
        document.createElement("script");

      script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/argon2-browser/1.18.0/argon2-bundled.min.js";

      script.async = true;

      script.dataset.shArgon2 = "true";

      script.onload = function () {

        if (window.argon2) {
          resolve(window.argon2);
        } else {
          reject(
            new Error("Argon2 could not be loaded.")
          );
        }

      };

      script.onerror = function () {

        reject(
          new Error("Argon2 library could not be loaded.")
        );

      };

      document.head.appendChild(script);
    });
  }


  /* ---------------------------------------------------------
     RANDOM BYTES
     --------------------------------------------------------- */

  function shRandomBytes(length) {

    return crypto.getRandomValues(
      new Uint8Array(length)
    );
  }


  /* ---------------------------------------------------------
     BYTE / BASE64 HELPERS
     --------------------------------------------------------- */

  function shBytesToBase64(bytes) {

    let binary = "";

    for (let i = 0; i < bytes.length; i++) {
      binary += String.fromCharCode(bytes[i]);
    }

    return btoa(binary);
  }


  function shBase64ToBytes(base64) {

    const binary =
      atob(base64);

    const bytes =
      new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
      bytes[i] =
        binary.charCodeAt(i);
    }

    return bytes;
  }


  function shStringToBytes(text) {

    return new TextEncoder().encode(text);
  }


  function shBytesToString(bytes) {

    return new TextDecoder().decode(bytes);
  }


  /* ---------------------------------------------------------
     ARGON2ID
     --------------------------------------------------------- */

  async function shDeriveArgon2Key(
    masterPassword,
    salt
  ) {

    const argon2 =
      await shLoadArgon2();

    const result =
      await argon2.hash({

        pass: masterPassword,

        salt: salt,

        time: 2,

        mem: 19456,

        parallelism: 1,

        hashLen: 32,

        type: argon2.ArgonType.Argon2id

      });

    return result.hash;
  }


  /* ---------------------------------------------------------
     AES-256-GCM KEY
     --------------------------------------------------------- */

  async function shImportAesKey(rawBytes) {

    return crypto.subtle.importKey(
      "raw",
      rawBytes,
      {
        name: "AES-GCM"
      },
      false,
      [
        "encrypt",
        "decrypt"
      ]
    );
  }


  /* ---------------------------------------------------------
     AES-256-GCM ENCRYPT
     --------------------------------------------------------- */

  async function shEncryptVault(
    data,
    key
  ) {

    const iv =
      shRandomBytes(12);

    const plaintext =
      shStringToBytes(
        JSON.stringify(data)
      );

    const ciphertext =
      await crypto.subtle.encrypt(
        {
          name: "AES-GCM",
          iv: iv,
          tagLength: 128
        },
        key,
        plaintext
      );

    return {

      iv:
        shBytesToBase64(iv),

      ciphertext:
        shBytesToBase64(
          new Uint8Array(ciphertext)
        )

    };
  }


  /* ---------------------------------------------------------
     AES-256-GCM DECRYPT
     --------------------------------------------------------- */

  async function shDecryptVault(
    encrypted,
    key
  ) {

    const iv =
      shBase64ToBytes(
        encrypted.iv
      );

    const ciphertext =
      shBase64ToBytes(
        encrypted.ciphertext
      );

    const plaintext =
      await crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: iv,
          tagLength: 128
        },
        key,
        ciphertext
      );

    return JSON.parse(
      shBytesToString(
        new Uint8Array(plaintext)
      )
    );
  }


  /* ---------------------------------------------------------
     CREATE NEW VAULT
     --------------------------------------------------------- */

  async function shCreateVault(
    masterPassword
  ) {

    if (!masterPassword) {
      throw new Error(
        "Master Password is required."
      );
    }

    const salt =
      shRandomBytes(16);

    const rawKey =
      await shDeriveArgon2Key(
        masterPassword,
        salt
      );

    const key =
      await shImportAesKey(
        rawKey
      );

    const data = [];

    const encrypted =
      await shEncryptVault(
        data,
        key
      );

    const vault = {

      version: 1,

      kdf: "Argon2id",

      memory: 19456,

      iterations: 2,

      parallelism: 1,

      encryption: "AES-256-GCM",

      salt:
        shBytesToBase64(salt),

      iv:
        encrypted.iv,

      ciphertext:
        encrypted.ciphertext
    };

    localStorage.setItem(
      VAULT_KEY,
      JSON.stringify(vault)
    );

    shVaultKey = key;

    shVaultData = [];

    shVaultUnlocked = true;
  }


  /* ---------------------------------------------------------
     UNLOCK VAULT
     --------------------------------------------------------- */

  async function shUnlockVault(
    masterPassword
  ) {

    const stored =
      localStorage.getItem(
        VAULT_KEY
      );

    if (!stored) {

      await shCreateVault(
        masterPassword
      );

      return true;
    }

    const vault =
      JSON.parse(stored);

    const salt =
      shBase64ToBytes(
        vault.salt
      );

    const rawKey =
      await shDeriveArgon2Key(
        masterPassword,
        salt
      );

    const key =
      await shImportAesKey(
        rawKey
      );

    const decrypted =
      await shDecryptVault(
        {
          iv: vault.iv,
          ciphertext: vault.ciphertext
        },
        key
      );

    if (!Array.isArray(decrypted)) {

      throw new Error(
        "Invalid vault."
      );
    }

    shVaultKey = key;

    shVaultData = decrypted;

    shVaultUnlocked = true;

    return true;
  }


  /* ---------------------------------------------------------
     SAVE VAULT
     --------------------------------------------------------- */

  async function shSaveVault() {

    if (
      !shVaultUnlocked ||
      !shVaultKey
    ) {
      throw new Error(
        "Vault is locked."
      );
    }

    const oldVault =
      JSON.parse(
        localStorage.getItem(
          VAULT_KEY
        )
      );

    const encrypted =
      await shEncryptVault(
        shVaultData,
        shVaultKey
      );

    const vault = {

      version:
        oldVault.version || 1,

      kdf:
        "Argon2id",

      memory:
        oldVault.memory || 19456,

      iterations:
        oldVault.iterations || 2,

      parallelism:
        oldVault.parallelism || 1,

      encryption:
        "AES-256-GCM",

      salt:
        oldVault.salt,

      iv:
        encrypted.iv,

      ciphertext:
        encrypted.ciphertext
    };

    localStorage.setItem(
      VAULT_KEY,
      JSON.stringify(vault)
    );
  }

     LOCK

  window.shSecureVaultLock =

      shVaultUnlocked = false;

      shVaultKey = null;

  /* ---------------------------------------------------------
     ADD ENTRY
     --------------------------------------------------------- */

  window.shSecureAddEntry =
    async function () {

      if (!shVaultUnlocked) {
        alert("Unlock the vault first.");
        return;
      }

      const title =
        document.getElementById(
          "shSecureTitle"

        document.getElementById(

      const password =

          "shSecurePassword"
        ).value;

      const description =
        document.getElementById(
          "shSecureDescription"
        ).value.trim();


      if (!title) {

        alert("Please enter Name / Title.");

        return;
      }


      if (!password) {

        alert("Please enter Password.");

        return;
      }


      if (description.length > 100) {

        alert(
          "Description must be 100 characters or less."
        );

        return;
      }


      shVaultData.push({

        id:
          crypto.randomUUID
            ? crypto.randomUUID()
            : Date.now().toString(),

        title:
          title,

        username:
          username,

        password:
          password,

        description:
          description,

        created:
          new Date().toISOString()

      });


      await shSaveVault();

      document.getElementById(
        "shSecureTitle"
      ).value = "";

      document.getElementById(
        "shSecureUsername"
      ).value = "";

      document.getElementById(
        "shSecurePassword"
      ).value = "";

      document.getElementById(
        "shSecureDescription"
      ).value = "";

      shRenderSecureVault();
    };


  /* ---------------------------------------------------------
     DELETE ENTRY
     --------------------------------------------------------- */

  window.shSecureDeleteEntry =
    async function (id) {

      if (!shVaultUnlocked) return;

      const ok =
        confirm(
          "Delete this password entry?"
        );

      if (!ok) return;

      shVaultData =
        shVaultData.filter(
          function (item) {
            return item.id !== id;
          }
        );

      await shSaveVault();

      shRenderSecureVault();
    };


  /* ---------------------------------------------------------
     COPY TO CLIPBOARD
     --------------------------------------------------------- */

  window.shSecureCopy =
    async function (
      text,
      message
    ) {

      try {

        await navigator.clipboard.writeText(
          text
        );

        alert(
          message +
          "\n\nClipboard will be cleared after 30 seconds."
        );

        setTimeout(
          async function () {

            try {

              const current =
                await navigator.clipboard.readText();

              if (current === text) {

                await navigator.clipboard.writeText("");

              }

            } catch (error) {

              /*
               Clipboard permissions may prevent
               automatic clearing.
              */

            }

          },
          30000
        );

      } catch (error) {

        alert(
          "Clipboard access was not available."
        );

      }
    };

  window.shSecureSearch =

    const searchInput =

<script>

  /* =================================
     SMART HUB — BASIC NAVIGATION
  ================================= */

  function shOpenPage(pageName) {

    const pages = document.querySelectorAll(".sh-page");

    pages.forEach(function(page) {
      page.classList.remove("sh-active");
    });

    const target = document.getElementById("sh-" + pageName);

    if (target) {
      target.classList.add("sh-active");
    }

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  /* =================================
     MENU
  ================================= */

  function shToggleMenu() {

    const home = document.getElementById("sh-home");

    if (home && home.classList.contains("sh-active")) {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    } else {
      shOpenPage("home");
    }
  }


  /* =================================
     SEARCH ENGINES
  ================================= */

  const shSearchEngines = {

    "DuckDuckGo":
      "https://duckduckgo.com/?q=",

    "Yandex":
      "https://yandex.com/search/?text=",

    "Microsoft Bing":
      "https://www.bing.com/search?q=",

    "Yahoo":
      "https://search.yahoo.com/search?p=",

    "Startpage":
      "https://www.startpage.com/sp/search?query=",

    "Ecosia":
      "https://www.ecosia.org/search?q=",

    "Mojeek":
      "https://www.mojeek.com/search?q=",

    "Swisscows":
      "https://swisscows.com/en/web?query=",

    "Gibiru":
      "https://gibiru.com/results.html?q=",

    "MetaGer":
      "https://metager.org/meta/meta.ger3?eingabe=",

    "SearXNG":
      "https://searx.be/search?q=",

    "Qwant":
      "https://www.qwant.com/?q="
  };


  /* =================================
     SEARCH FUNCTION
  ================================= */

  function shSearch() {

    const input =
      document.getElementById("sh-search-input");

    const engine =
      document.getElementById("sh-search-engine");

    if (!input || !engine) {
      return;
    }

    const query =
      input.value.trim();

    const selectedEngine =
      engine.value;

    if (!query) {

      alert("براہِ کرم Search یا URL لکھیں۔");

      input.focus();

      return;
    }


    /* اگر URL لکھا گیا ہو */

    let isUrl =
      /^(https?:\/\/)/i.test(query) ||
      /^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(query);


    if (isUrl) {

      let url = query;

      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
      }

      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

      return;
    }


    /* Search Engine */

    const baseUrl =
      shSearchEngines[selectedEngine];

    if (!baseUrl) {

      alert("Search Engine دستیاب نہیں ہے۔");

      return;
    }

    const searchUrl =
      baseUrl +
      encodeURIComponent(query);

    window.open(
      searchUrl,
      "_blank",
      "noopener,noreferrer"
    );
  }


  /* =================================
     ENTER KEY SEARCH
  ================================= */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      const input =
        document.getElementById("sh-search-input");

      if (input) {

        input.addEventListener(
          "keydown",
          function(event) {

            if (event.key === "Enter") {
              shSearch();
            }

          }
        );

      }

    }
  );

<script>

  /* =========================================
     PASSWORD MANAGER STATE
  ========================================= */

  const shPasswordManager = {

    entries: [],

    unlocked: false,

    autoLockMinutes: 10,

    clipboardTimer: null

  };


  /* =========================================
     PASSWORD MANAGER STORAGE
  ========================================= */

  function shPMGetStoredData() {

    const data =
      localStorage.getItem(
        "sh_password_entries"
      );

    if (!data) {
      return [];
    }

    try {

      const parsed =
        JSON.parse(data);

      return Array.isArray(parsed)
        ? parsed
        : [];

    } catch (error) {

      return [];

    }

  }


  function shPMSaveData() {

    /*
      IMPORTANT:
      This is temporary local storage.
      The final secure vault will use
      proper authenticated encryption.
    */

    localStorage.setItem(
      "sh_password_entries",
      JSON.stringify(
        shPasswordManager.entries
      )
    );

  }


  /* =========================================
     PASSWORD VISIBILITY
  ========================================= */

  function shPMTogglePassword() {

    const input =
      document.getElementById(
        "sh-pm-password"
      );

    const button =
      document.getElementById(
        "sh-pm-show"
      );


    if (!input || !button) {
      return;
    }


    if (input.type === "password") {

      input.type = "text";

      button.textContent =
        "🙈 Hide Password";

    } else {

      input.type = "password";

      button.textContent =
        "👁️ Show Password";

    }

  }


  /* =========================================
     MASTER PASSWORD
  ========================================= */

  function shPMCreateMasterPassword() {

    const input =
      document.getElementById(
        "sh-pm-master-password"
      );


    if (!input) {
      return;
    }


    const password =
      input.value;


    if (password.length < 10) {

      alert(
        "Vault Master Password کم از کم 10 characters کا رکھیں۔"
      );

      input.focus();

      return;

    }


    /*
      Temporary setup marker.
      Real cryptographic vault setup
      will be added in the secure vault stage.
    */

    localStorage.setItem(
      "sh_pm_vault_initialized",
      "true"
    );


    alert(
      "Vault Master Password setup مکمل ہوگیا۔"
    );


    input.value = "";

    shPMUpdateLockStatus();

  }


  /* =========================================
     LOCK / UNLOCK
  ========================================= */

  function shPMLock() {

    shPasswordManager.unlocked =
      false;


    const panel =
      document.getElementById(
        "sh-pm-vault-content"
      );


    if (panel) {

      panel.style.display =
        "none";

    }


    shPMUpdateLockStatus();

  }


  function shPMUnlock() {

    const input =
      document.getElementById(
        "sh-pm-unlock-password"
      );


    if (!input) {
      return;
    }


    if (!localStorage.getItem(
      "sh_pm_vault_initialized"
    )) {

      alert(
        "پہلے Vault Master Password بنائیں۔"
      );

      return;

    }


    if (!input.value) {

      alert(
        "Vault Master Password درج کریں۔"
      );

      return;

    }


    /*
      Temporary unlock state.
      The final version will verify the
      password against the encrypted vault.
    */

    shPasswordManager.unlocked =
      true;


    input.value = "";


    const panel =
      document.getElementById(
        "sh-pm-vault-content"
      );


    if (panel) {

      panel.style.display =
        "block";

    }


    shPMUpdateLockStatus();

    shPMRenderEntries();

    shPMStartAutoLock();

  }


  function shPMUpdateLockStatus() {

    const status =
      document.getElementById(
        "sh-pm-lock-status"
      );


    if (!status) {
      return;
    }


    if (
      shPasswordManager.unlocked
    ) {

      status.textContent =
        "🔓 Vault Unlocked";

    } else {

      status.textContent =
        "🔒 Vault Locked";

    }

  }


  /* =========================================
     ADD PASSWORD ENTRY
  ========================================= */

  function shPMAddEntry() {

    if (
      !shPasswordManager.unlocked
    ) {

      alert(
        "پہلے Vault Unlock کریں۔"
      );

      return;

    }


    const title =
      document
        .getElementById(
          "sh-pm-title"
        )
        .value
        .trim();


    const username =
      document
        .getElementById(
          "sh-pm-username"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "sh-pm-password"
        )
        .value;


    const description =
      document
        .getElementById(
          "sh-pm-description"
        )
        .value
        .trim();


    if (!title) {

      alert(
        "Name / Title درج کریں۔"
      );

      return;

    }


    if (!password) {

      alert(
        "Password درج کریں۔"
      );

      return;

    }


    if (
      description.length > 100
    ) {

      alert(
        "Description زیادہ سے زیادہ 100 characters کی ہوسکتی ہے۔"
      );

      return;

    }


    const entry = {

      id:
        Date.now()
        .toString(),

      title:
        title,

      username:
        username,

      password:
        password,

      description:
        description,

      created:
        new Date()
          .toISOString()

    };


    shPasswordManager.entries.push(
      entry
    );


    shPMSaveData();

    shPMClearForm();

    shPMRenderEntries();

    shPMStartAutoLock();


    alert(
      "Password entry محفوظ ہوگئی۔"
    );

  }


  /* =========================================
     CLEAR FORM
  ========================================= */

  function shPMClearForm() {

    const ids = [

      "sh-pm-title",

      "sh-pm-username",

      "sh-pm-password",

      "sh-pm-description"

    ];


    ids.forEach(
      function(id) {

        const element =
          document.getElementById(id);

        if (element) {
          element.value = "";
        }

      }
    );

  }


  /* =========================================
     DELETE ENTRY
  ========================================= */

  function shPMDeleteEntry(id) {

    if (
      !shPasswordManager.unlocked
    ) {

      alert(
        "Vault Locked ہے۔"
      );

      return;

    }


    const confirmed =
      confirm(
        "کیا آپ یہ password entry حذف کرنا چاہتے ہیں؟"
      );


    if (!confirmed) {
      return;
    }


    shPasswordManager.entries =
      shPasswordManager.entries.filter(
        function(entry) {
          return entry.id !== id;
        }
      );


    shPMSaveData();

    shPMRenderEntries();

  }


  /* =========================================
     COPY TO CLIPBOARD
  ========================================= */

  async function shPMCopy(text) {

    if (!text) {
      return;
    }


    try {

      await navigator.clipboard.writeText(
        text
      );

      alert(
        "Clipboard میں copy ہوگیا۔ اسے 30 seconds بعد clear کرنے کی کوشش کی جائے گی۔"
      );


      if (
        shPasswordManager.clipboardTimer
      ) {

        clearTimeout(
          shPasswordManager.clipboardTimer
        );

      }


      shPasswordManager.clipboardTimer =
        setTimeout(
          async function() {

            try {

              await navigator.clipboard.writeText("");

            } catch (error) {

              /*
                Some browsers do not allow
                background clipboard changes.
              */

            }

          },
          30000
        );


    } catch (error) {

      alert(
        "Clipboard access اس browser میں دستیاب نہیں ہے۔"
      );

    }

  }


  /* =========================================
     SEARCH ENTRIES
  ========================================= */

  function shPMSearch() {

    const input =
      document.getElementById(
        "sh-pm-search"
      );


    if (!input) {
      return;
    }


    const query =
      input.value
        .trim()
        .toLowerCase();


    const cards =
      document.querySelectorAll(
        ".sh-pm-entry"
      );


    cards.forEach(
      function(card) {

        const text =
          card.textContent
            .toLowerCase();


        if (
          !query ||
          text.includes(query)
        ) {

          card.style.display =
            "block";

        } else {

          card.style.display =
            "none";

        }

      }
    );

  }


  /* =========================================
     RENDER ENTRIES
  ========================================= */

  function shPMRenderEntries() {

    const container =
      document.getElementById(
        "sh-pm-entries"
      );


    if (!container) {
      return;
    }


    container.innerHTML = "";


    if (
      shPasswordManager.entries.length === 0
    ) {

      container.innerHTML = `
        <div class="sh-ai-answer">
          ابھی کوئی Password محفوظ نہیں ہے۔
        </div>
      `;

      return;

    }


    shPasswordManager.entries.forEach(
      function(entry) {

  /* =========================================
     COPY ENTRY FIELD
  ========================================= */

  function shPMCopyById(
    id,
    field
  ) {

    if (
      !shPasswordManager.unlocked
    ) {

      alert(
        "Vault Locked ہے۔"
      );

      return;

    }


    const entry =
      shPasswordManager.entries.find(
        function(item) {
          return item.id === id;
        }
      );


    if (!entry) {
      return;
    }


    if (field === "username") {

      shPMCopy(
        entry.username
      );

      return;

    }


    if (field === "password") {

      shPMCopy(
        entry.password
      );

    }

  }


  /* =========================================
     BASIC HTML ESCAPING
  ========================================= */

  function shPMEscape(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================================

  function shPMStartAutoLock() {

    if (

      setTimeout(
        function() {

          alert(

          );

        },
        shPasswordManager.autoLockMinutes *
        60 *
        1000
      );

  }

  function shBindSettingsEvents() {

    const bindings = {

      shAppearance: function (value) {
        shSettings.appearance = value;
      },

      shFontSize: function (value) {
        shSettings.fontSize = value;
      },

      shInterfaceSize: function (value) {
        shSettings.interfaceSize = value;
      },

      shDataSaver: function (value) {
        shSettings.dataSaver = value;

        if (value) {
          shSettings.reduceImages = true;
          shSettings.reduceVideos = true;
          shSettings.blockAutoplay = true;
          shSettings.reduceAutoRefresh = true;
        }
      },

      shReduceImages: function (value) {
        shSettings.reduceImages = value;
      },

      shReduceVideos: function (value) {
        shSettings.reduceVideos = value;
      },

      shBlockAutoplay: function (value) {
        shSettings.blockAutoplay = value;
      },

      shReduceAutoRefresh: function (value) {
        shSettings.reduceAutoRefresh = value;
      },

      shBatterySaver: function (value) {
        shSettings.batterySaver = value;

        if (value) {
          shSettings.reduceAnimations = true;
          shSettings.reduceAutoRefresh = true;
          shSettings.reduceBackgroundActivity = true;
        }
      },

      shReduceAnimations: function (value) {
        shSettings.reduceAnimations = value;
      },

      shBatteryAutoRefresh: function (value) {
        shSettings.reduceAutoRefresh = value;
      },

      shReduceBackground: function (value) {
        shSettings.reduceBackgroundActivity = value;
      },

      shSaveSearchHistory: function (value) {
        shSettings.saveSearchHistory = value;
      },

      shSaveBrowsingData: function (value) {
        shSettings.saveBrowsingData = value;
      },

      shDoNotTrack: function (value) {
        shSettings.doNotTrack = value;
      },

      shSettingsLock: function (value) {
        shSettings.settingsLock = value;
      },

      shNotifications: function (value) {
        shSettings.notifications = value;
      },

      shSecurityAlerts: function (value) {
        shSettings.securityAlerts = value;
      },

      shFeatureNotifications: function (value) {
        shSettings.featureNotifications = value;
      },

      shOpenResultsNewTab: function (value) {
        shSettings.openResultsNewTab = value;
      },

      shOpenSelectedBrowser: function (value) {
        shSettings.openLinksSelectedBrowser = value;
      }
    };

    Object.keys(bindings).forEach(function (id) {

      const element = shGet(id);

      if (!element) return;

      element.addEventListener("change", function () {

        const value =
          element.type === "checkbox"
            ? element.checked
            : element.value;

        bindings[id](value);

        shSaveSettings();
        shApplySettings();
      });
    });


    const selectBindings = {
      shCookiePreference: "cookiePreference",
      shDefaultSearchEngine: "defaultSearchEngine",
      shSearchTimeRange: "searchTimeRange",
      shDefaultBrowser: "defaultBrowser",
      shLanguage: "language",
      shAutoLockMinutes: "autoLockMinutes"
    };

    Object.keys(selectBindings).forEach(function (id) {

      const element = shGet(id);

      if (!element) return;

      element.addEventListener("change", function () {

        let value = element.value;

        if (id === "shAutoLockMinutes") {
          value = Number(value);
        }

        shSettings[selectBindings[id]] = value;

        shSaveSettings();
        shApplySettings();
      });
    });
  }


  function shApplySettings() {

    const root = document.documentElement;

    root.classList.remove(
      "sh-theme-light",
      "sh-theme-dark",
      "sh-font-small",
      "sh-font-large",
      "sh-interface-small",
      "sh-interface-large"
    );

    let appearance = shSettings.appearance;

    if (appearance === "dark") {
      root.classList.add("sh-theme-dark");
    }

    if (appearance === "light") {
      root.classList.add("sh-theme-light");
    }

    if (shSettings.fontSize === "small") {
      root.classList.add("sh-font-small");
    }

    if (shSettings.fontSize === "large") {
      root.classList.add("sh-font-large");
    }

    if (shSettings.interfaceSize === "small") {
      root.classList.add("sh-interface-small");
    }

    if (shSettings.interfaceSize === "large") {
      root.classList.add("sh-interface-large");
    }

    if (shSettings.reduceAnimations || shSettings.batterySaver) {
      root.style.setProperty(
        "--sh-animation-speed",
        "0s"
      );
    } else {
      root.style.removeProperty(
        "--sh-animation-speed"
      );
    }

    shSaveSettings();
  }

     PRIVACY / DATA FUNCTIONS
     ========================= */

  window.shClearSearchHistory = function () {

    const keys = [
      "smartHubSearchHistory",
      "shSearchHistory",
      "searchHistory"
    ];

    keys.forEach(function (key) {
      localStorage.removeItem(key);
    });

    alert("Search history cleared.");
  };


  window.shClearBrowsingData = function () {

    const keys = [
      "smartHubBrowsingData",
      "shBrowsingData",
      "smartHubBrowserData"
    ];

    keys.forEach(function (key) {
      localStorage.removeItem(key);
    });

    alert("Browsing data cleared.");
  };


  window.shClearLocalData = function () {

    const ok = confirm(
      "Clear Smart Hub local data?"
    );

    if (!ok) return;

    localStorage.removeItem("smartHubSearchHistory");
    localStorage.removeItem("shSearchHistory");
    localStorage.removeItem("smartHubBrowsingData");
    localStorage.removeItem("shBrowsingData");

    alert("Selected local data has been cleared.");
  };


  window.shClearSensitiveData = function () {

    const ok = confirm(
      "Clear sensitive local data?"
    );

    if (!ok) return;

    localStorage.removeItem("smartHubTemporaryData");
    localStorage.removeItem("smartHubSessionData");

    alert("Sensitive temporary data cleared.");
  };


  /* =========================
     RESET SETTINGS
     ========================= */

  window.shResetSettings = function () {

    const ok = confirm(
      "Reset all Smart Hub settings to default?"
    );

    if (!ok) return;

    shSettings = Object.assign({}, defaultSettings);

    shSaveSettings();

    shBuildSettings();

    alert("Settings have been reset.");
  };


  window.shResetSmartHubSettings = function () {

    const ok = confirm(
      "Reset Smart Hub settings?"
    );

    if (!ok) return;

    shSettings = Object.assign({}, defaultSettings);

    shSaveSettings();

    shBuildSettings();

    alert("Smart Hub settings reset successfully.");
  };


  /* =========================
     DATA MANAGEMENT
     ========================= */

  window.shExportMyLinks = function () {

    const data =
      localStorage.getItem("smartHubMyWeb") ||
      localStorage.getItem("smartHubLinks") ||
      "[]";

    shDownloadTextFile(
      "smart-hub-my-links.json",
      data
    );
  };


  window.shImportMyLinks = function () {

    const input = document.createElement("input");

    input.type = "file";
    input.accept = ".json,application/json";

    input.onchange = function () {

      const file = input.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function () {

        try {

          const data = JSON.parse(reader.result);

          localStorage.setItem(
            "smartHubMyWeb",
            JSON.stringify(data)
          );

          alert("My Links imported successfully.");

        } catch (error) {

          alert("Invalid JSON file.");

        }

      };

      reader.readAsText(file);
    };

    input.click();
  };


  window.shExportContacts = function () {

    const data =
      localStorage.getItem("smartHubContacts") ||
      "[]";

    shDownloadTextFile(
      "smart-hub-contacts.json",
      data
    );
  };


  window.shClearContacts = function () {

    const ok = confirm(
      "Clear all saved Smart Hub contacts?"
    );

    if (!ok) return;

    localStorage.removeItem(
      "smartHubContacts"
    );

    alert("Contacts cleared.");
  };


  window.shClearAllSmartHubData = function () {

    const ok = confirm(
      "WARNING: This will clear Smart Hub local data and settings. Continue?"
    );

    if (!ok) return;

    const second = confirm(
      "Are you absolutely sure?"
    );

    if (!second) return;

    localStorage.clear();

    shSettings = Object.assign(
      {},
      defaultSettings
    );

    alert(
      "All Smart Hub local data has been cleared. The page will reload."
    );

    location.reload();
  };


  function shDownloadTextFile(filename, text) {

    const blob = new Blob(
      [text],
      {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }


  /* =========================
     INITIALIZATION
     ========================= */

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      shBuildSettings();

    }
  );

})();
</script>

<!-- =========================================================
     SMART HUB — PART 11
     FINAL INTEGRATION & CLEANUP
     ========================================================= -->

<script>
(function () {
    "use strict";

    /* =========================================================
       1. SAFE PAGE NAVIGATION
       ========================================================= */

    window.shOpenPage = function (pageId) {
        const pages = document.querySelectorAll("[id^='sh-']");

        pages.forEach(function (page) {
            page.classList.remove("active");
            page.style.display = "none";
        });

        const target = document.getElementById(pageId);

        if (target) {
            target.classList.add("active");
            target.style.display = "block";
        }

        /* Close menu if available */
        const menu = document.getElementById("shMenu");
        if (menu) {
            menu.classList.remove("show");
        }

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        /* Refresh dynamic pages when opened */
        try {
            if (pageId === "sh-password" &&
                typeof window.shRenderSecureVault === "function") {
                window.shRenderSecureVault();
            }

            if (pageId === "sh-settings" &&
                typeof window.shLoadSettings === "function") {
                window.shLoadSettings();
            }

            if (pageId === "sh-web" &&
                typeof window.shLoadMyWeb === "function") {
                window.shLoadMyWeb();
            }
        } catch (error) {
            console.warn("Smart Hub page refresh warning:", error);
        }
    };


    /* =========================================================
       2. MENU TOGGLE
       ========================================================= */

    window.shToggleMenu = function () {
        const menu = document.getElementById("shMenu");

        if (!menu) return;

        menu.classList.toggle("show");
    };


    /* =========================================================
       3. CLOSE MENU WHEN CLICKING OUTSIDE
       ========================================================= */

    document.addEventListener("click", function (event) {
        const menu = document.getElementById("shMenu");
        const button = document.querySelector(
            "[onclick*='shToggleMenu']"
        );

        if (!menu) return;

        if (
            !menu.contains(event.target) &&
            (!button || !button.contains(event.target))
        ) {
            menu.classList.remove("show");
        }
    });


    /* =========================================================
       4. SEARCH ENGINE CUSTOM URL NORMALIZER
       ========================================================= */

    window.shBuildSearchUrl = function (engine, query) {

        const encodedQuery = encodeURIComponent(
            String(query || "").trim()
        );

        const engines = {
            duckduckgo:
                "https://duckduckgo.com/?q=",

            yandex:
                "https://yandex.com/search/?text=",

            bing:
                "https://www.bing.com/search?q=",

            yahoo:
                "https://search.yahoo.com/search?p=",

            startpage:
                "https://www.startpage.com/sp/search?query=",

            ecosia:
                "https://www.ecosia.org/search?q=",

            mojeek:
                "https://www.mojeek.com/search?q=",

            swisscows:
                "https://swisscows.com/en/web?query=",

            gibiru:
                "https://gibiru.com/results.html?q=",

            metager:
                "https://metager.org/meta/meta.ger3?eingabe=",

            searxng:
                "https://searx.be/search?q=",

            qwant:
                "https://www.qwant.com/?q=",

            opera:
                "https://www.google.com/search?q="
        };

        const key = String(engine || "")
            .toLowerCase()
            .replace(/\s+/g, "")
            .replace(/-/g, "");

        if (engines[key]) {
            return engines[key] + encodedQuery;
        }

        /* Custom search engine */
        if (typeof engine === "string" &&
            engine.trim() !== "") {

            let custom = engine.trim();

            if (custom.indexOf("{query}") !== -1) {
                return custom.replace(
                    "{query}",
                    encodedQuery
                );
            }

            if (
                custom.indexOf("?") === -1 &&
                !custom.endsWith("/")
            ) {
                custom += "/";
            }

            return custom +
                (custom.indexOf("?") !== -1 ? "&q=" : "?q=") +
                encodedQuery;
        }

        return "https://duckduckgo.com/?q=" +
            encodedQuery;
    };


    /* =========================================================
       5. SMART HUB SETTINGS — SAFE APPEARANCE
       ========================================================= */

    window.shApplyFinalAppearance = function () {

        let settings = {};

        try {
            settings = JSON.parse(
                localStorage.getItem("smartHubSettings") || "{}"
            );
        } catch (error) {
            settings = {};
        }

        const appearance =
            settings.appearance || "system";

        document.body.classList.remove(
            "sh-light-mode",
            "sh-dark-mode"
        );

        if (appearance === "dark") {
            document.body.classList.add("sh-dark-mode");
        }

        if (appearance === "light") {
            document.body.classList.add("sh-light-mode");
        }

        /*
         System mode intentionally does not force
         light or dark. CSS media rules can handle it.
        */
    };


    /* =========================================================
       6. SETTINGS CHANGE LISTENER
       ========================================================= */

    window.shSaveFinalSetting = function (name, value) {

        let settings = {};

        try {
            settings = JSON.parse(
                localStorage.getItem("smartHubSettings") || "{}"
            );
        } catch (error) {
            settings = {};
        }

        settings[name] = value;

        localStorage.setItem(
            "smartHubSettings",
            JSON.stringify(settings)
        );

        if (name === "appearance") {
            window.shApplyFinalAppearance();
        }
    };


    /* =========================================================
       7. SECURE VAULT — AUTO LOCK
       ========================================================= */

    let shSecureAutoLockTimer = null;

    window.shStartSecureAutoLock = function () {

        if (shSecureAutoLockTimer) {
            clearTimeout(shSecureAutoLockTimer);
        }

        let settings = {};

        try {
            settings = JSON.parse(
                localStorage.getItem("smartHubSettings") || "{}"
            );
        } catch (error) {
            settings = {};
        }

        /*
         Default: 15 minutes.
         */
        let minutes = Number(
            settings.passwordAutoLock ||
            settings.autoLockMinutes ||
            15
        );

        if (!Number.isFinite(minutes) || minutes < 1) {
            minutes = 15;
        }

        shSecureAutoLockTimer = setTimeout(function () {

            try {

                if (
                    typeof window.shSecureLock === "function"
                ) {
                    window.shSecureLock();
                }

                if (
                    typeof window.shRenderSecureVault === "function"
                ) {
                    window.shRenderSecureVault();
                }

            } catch (error) {
                console.warn(
                    "Secure vault auto-lock warning:",
                    error
                );
            }

        }, minutes * 60 * 1000);
    };


    /* =========================================================
       8. RESET AUTO-LOCK TIMER AFTER USER ACTIVITY
       ========================================================= */

    function shResetSecureActivityTimer() {

        try {

            if (
                typeof window.shSecureVaultUnlocked !== "undefined" &&
                window.shSecureVaultUnlocked === true
            ) {
                window.shStartSecureAutoLock();
            }

        } catch (error) {
            /* Ignore activity timer errors */
        }
    }

    document.addEventListener(
        "click",
        shResetSecureActivityTimer,
        true
    );

    document.addEventListener(
        "keydown",
        shResetSecureActivityTimer,
        true
    );


    /* =========================================================
       9. LEGACY PLAINTEXT PASSWORD DATA WARNING
       ========================================================= */

    window.shCheckLegacyPasswordData = function () {

        const legacyKey =
            "smartHubPasswordManager";

        const oldData =
            localStorage.getItem(legacyKey);

        if (!oldData) {
            return false;
        }

        console.warn(
            "Smart Hub: legacy password data exists in localStorage."
        );

        return true;
    };


    /* =========================================================
       10. REMOVE OLD PLAINTEXT PASSWORD DATA
       ========================================================= */

    window.shRemoveLegacyPasswordData = function () {

        const legacyKey =
            "smartHubPasswordManager";

        if (!localStorage.getItem(legacyKey)) {
            return;
        }

        const confirmed = window.confirm(
            "پرانی Password Manager data کو delete کرنا ہے؟\n\n" +
            "یہ data secure vault کے باہر موجود ہے۔\n\n" +
            "اگر آپ نے پرانی entries secure vault میں منتقل نہیں کیں " +
            "تو پہلے انہیں محفوظ کر لیں۔"
        );

        if (!confirmed) {
            return;
        }

        localStorage.removeItem(legacyKey);

        alert(
            "پرانی Password Manager data delete کر دی گئی ہے۔"
        );

        try {
            if (
                typeof window.shRenderSecureVault === "function"
            ) {
                window.shRenderSecureVault();
            }
        } catch (error) {
            console.warn(error);
        }
    };


    /* =========================================================
       11. CLIPBOARD SAFETY
       ========================================================= */

    window.shSecureCopyText = async function (
        text,
        clearAfterSeconds
    ) {

        if (!navigator.clipboard) {
            alert(
                "اس browser میں Clipboard access دستیاب نہیں ہے۔"
            );
            return false;
        }

        try {

            await navigator.clipboard.writeText(
                String(text || "")
            );

            const seconds =
                Number(clearAfterSeconds) || 30;

            setTimeout(async function () {

                /*
                 Clipboard automatically clear کرنا
                 browser permissions پر depend کرتا ہے۔
                */

                try {
                    await navigator.clipboard.writeText("");
                } catch (error) {
                    console.warn(
                        "Clipboard auto-clear unavailable:",
                        error
                    );
                }

            }, seconds * 1000);

            return true;

        } catch (error) {

            console.warn(
                "Clipboard copy failed:",
                error
            );

            alert(
                "Clipboard میں copy نہیں ہو سکا۔"
            );

            return false;
        }
    };


    /* =========================================================
       12. DO NOT STORE MASTER PASSWORD
       ========================================================= */

    window.shNeverStoreMasterPassword = function () {

        /*
         Important security rule:
         Master Password کو localStorage,
         sessionStorage یا کسی HTML field میں
         مستقل طور پر محفوظ نہیں کیا جائے گا۔
        */

        try {
            sessionStorage.removeItem(
                "smartHubMasterPassword"
            );
        } catch (error) {
            /* Ignore */
        }
    };


    /* =========================================================
       13. LEGACY DATA CHECK ON START
       ========================================================= */

    function shFinalSecurityCheck() {

        window.shNeverStoreMasterPassword();

        window.shCheckLegacyPasswordData();

        window.shApplyFinalAppearance();

        if (
            typeof window.shStartSecureAutoLock === "function"
        ) {
            window.shStartSecureAutoLock();
        }
    }


    /* =========================================================
       14. FINAL INITIALIZATION
       ========================================================= */

    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            shFinalSecurityCheck
        );

    } else {

        shFinalSecurityCheck();
    }


    /* =========================================================
       15. SECURITY INFORMATION
       ========================================================= */

    window.smartHubSecurityInfo = {
        vaultEncryption: "AES-256-GCM",
        keyDerivation: "Argon2id",
        masterPasswordStorage: "Never stored as plaintext",
        clipboardAutoClear: "Best effort",
        systemFirewall: "Not controlled by Smart Hub",
        phoneAccess: "Not allowed by Smart Hub Web App"
    };


    console.log(
        "Smart Hub Part 11 loaded successfully."
    );

})();
</script>
